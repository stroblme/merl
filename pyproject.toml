[project]
name = "merl"
version = "0.1.0"
description = "A tiny autocompletion tool for 'accent'"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melvin Strobl", email = "stroblme@posteo.de" }]
dependencies = [
    "flax>=0.12.9",
    "jax>=0.11.1",
    "optax>=0.2.8",
]

[project.scripts]
merl = "merl.cli:main"

[dependency-groups]
cuda12 = ["jax[cuda12]>=0.11.1"]
cuda13 = ["jax[cuda13]>=0.11.1"]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "fluksio",
]

[tool.uv.sources]
fluksio = { git = "https://git.stroblme.de/Fluksio/app", rev = "8a94bf10d79f7eacc97ad32719a4c00a43d3a317", subdirectory = "backend" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["merl"]
# Trained weights live inside the package so the wheel ships a usable model.
artifacts = ["merl/weights.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
